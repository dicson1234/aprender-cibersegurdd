name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Capacitor Android Project
        run: |
          mkdir -p dist
          cp -r css js data assets index.html manifest.json sw.js dist/ || true
          npx cap add android || true
          npx cap sync android
          python3 -c "
with open('android/app/build.gradle', 'r') as f:
    c = f.read()
if 'kotlin-stdlib-jdk7' not in c:
    c = c.replace('dependencies {', 'configurations.all {\n        resolutionStrategy {\n            exclude group: \"org.jetbrains.kotlin\", module: \"kotlin-stdlib-jdk7\"\n            exclude group: \"org.jetbrains.kotlin\", module: \"kotlin-stdlib-jdk8\"\n        }\n    }\n\ndependencies {')
    with open('android/app/build.gradle', 'w') as f:
        f.write(c)
"

      - name: Build APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberLab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
